# wort: TLS terminator in front of the FastAPI app (compose.yaml, wort-web shares this
# container's network namespace and listens on its 127.0.0.1:8000, never published).
#
# Self-signed cert in ~/.config/wort/certs (outside the repo); browsers warn once on a
# private LAN IP, see DEPLOY.md for generating it and for trusting it.

limit_req_zone $binary_remote_addr zone=wort_sync:1m rate=30r/m;

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/wort.crt;
    ssl_certificate_key /etc/nginx/certs/wort.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The import cap in app/importer.py is 20 MiB; a bit of headroom for multipart framing.
    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

# The CLI's one network path: POST /sync, nothing else. Same certificate, own port (compose.yaml), own app
# (app/sync_app.py) that only accepts a write-only token. Everything but POST /sync is 404 here.
server {
    listen 8456 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/wort.crt;
    ssl_certificate_key /etc/nginx/certs/wort.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 21m;
    client_body_timeout 30s;

    location = /sync {
        limit_except POST { deny all; }
        limit_req zone=wort_sync burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
