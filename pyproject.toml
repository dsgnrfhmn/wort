[project]
name = "wort"
version = "0.1.0"
description = "Terminal app for learning German vocabulary: offline Wiktionary lookup with grammar, spaced-repetition exercises, progress overview. Command: wort."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
wort = "wort.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "argon2-cffi>=25.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
