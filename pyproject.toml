[project]
name = "lernen"
version = "0.1.0"
description = "Terminal app for learning German vocabulary: offline Wiktionary lookup with grammar, spaced-repetition exercises, progress overview. Command: wort."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
wort = "lernen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lernen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
