services:
  # TLS front. Published on the LAN IP only (not 0.0.0.0, not localhost), same as <other-service>.
  wort-tls:
    image: docker.io/library/nginx:alpine
    container_name: wort-tls
    ports:
      - "${WORT_BIND_IP:?set WORT_BIND_IP to the server LAN IP}:8455:443"
      # The CLI's word push (POST /sync, write-only token). Same LAN IP only; see DEPLOY.md "CLI network".
      - "${WORT_BIND_IP}:8456:8456"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS cert and key live outside the repository (never in git). See DEPLOY.md.
      - ${HOME}/.config/wort/certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # The FastAPI app. Shares wort-tls's network namespace, so it listens on that namespace's
  # 127.0.0.1:8000 and nginx proxies to it. No `ports:` of its own: unreachable from the LAN.
  # Restarting wort-tls restarts this service too (the namespace belongs to wort-tls).
  wort-web:
    build: ./deploy/web
    image: localhost/wort-web:local
    container_name: wort-web
    network_mode: "service:wort-tls"
    depends_on:
      - wort-tls
    working_dir: /app
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      WORT_HOME: /data                  # web.db goes here (the wort-data volume)
      WORT_LT_URL: http://127.0.0.1:8010   # wort-lt below, same network namespace; loopback, so the client accepts it
      PYTHONPATH: /app/src:/app
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/app:ro
      - wort-data:/data
      # The dictionary is built by the CLI importer on the host; the web app only reads it.
      - ${HOME}/.local/share/wort/dictionary.db:/data/dictionary.db:ro
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # LanguageTool, the grammar check, comes up and goes down with the stack. Shares wort-tls's network namespace like
  # wort-web, so wort-web reaches it at 127.0.0.1:8010 and nothing else can: no `ports:` here and nginx does not proxy
  # it, so a browser on the LAN gets the grammar results through the app only. Started without the image's `--public`,
  # so the server listens on loopback inside that namespace (checked 2026-10-30 with this command: the namespace's own
  # LAN address refuses, 127.0.0.1 answers). Same image, digest and heap as scripts/languagetool.sh (DECISIONS D4); bump
  # both together. About 1 GB of RAM: do not run that script's container
  # (wort-languagetool, host port 8081) at the same time on this host. wort-web does not depend on it: while it is
  # down or still starting, a sentence is "not checked" and changes no score.
  wort-lt:
    image: docker.io/erikvl87/languagetool:6.5@sha256:9bc387f54513615648898ad60dd91bad7ba3c3b018cb2abe9f0ba61ec70681c4
    container_name: wort-lt
    network_mode: "service:wort-tls"
    depends_on:
      - wort-tls
    command: ["java", "-Xms256m", "-Xmx1g", "-cp", "languagetool-server.jar", "org.languagetool.server.HTTPServer",
              "--port", "8010", "--config", "config.properties"]
    mem_limit: 1500m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The CLI sync endpoint: one route, no dictionary, no session cookies. Own process so that the CLI's
  # token can never reach a page; it shares web.db (WAL) with wort-web. Same namespace/hardening as wort-web.
  wort-sync:
    build: ./deploy/web
    image: localhost/wort-web:local
    container_name: wort-sync
    network_mode: "service:wort-tls"
    depends_on:
      - wort-tls
    working_dir: /app
    command: ["uvicorn", "app.sync_app:create_sync_app", "--factory", "--host", "127.0.0.1", "--port", "8001"]
    environment:
      WORT_HOME: /data
      PYTHONPATH: /app/src:/app
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/app:ro
      - wort-data:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  # web.db (imported history, favorites). Rootless podman: container root is the host user.
  wort-data:
